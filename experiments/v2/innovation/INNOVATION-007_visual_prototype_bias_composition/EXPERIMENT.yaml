module:
  module_id: VEBC
  name: VPA + Episodic Bias Calibration
  purpose: VPA提高属性驱动的unseen类内判别，EBC恢复seen/unseen联合竞争平衡
  inputs: [CCGR主原型, CRA属性logits, 属性生成视觉原型logits, seen类别掩码]
  output: CRA+VPA融合logits及seen扣减gamma后的最终logits
  formula: logits=logits_CRA+beta_v*cos(x,p_attr_visual)-gamma*I[c in seen]
  switches: {forward_ridge: 0.01, reverse_ridge: 0.01, max_gamma: 0.30}
  baseline_off_behavior: beta_v=0关闭VPA；gamma=0关闭EBC；两者关闭回到CRA
  parent_condition: TG-VPR + TST + NTR + CCGR + CRA
  training: VPA beta用seen CE；EBC在重建正反ridge的三折pseudo-unseen episode中训练gamma
