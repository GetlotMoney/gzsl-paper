module:
  module_id: CRA
  name: Centroid Ridge Alignment
  purpose: 用每类一个视觉中心等权拟合属性映射，避免图像级ridge吸收类内噪声
  inputs: [150个seen视觉中心, CCGR类别原型, CUB标准312维类别属性]
  output: CCGR主logit与类别中心属性残差logit之和
  formula: W=(C_seen^T C_seen + 0.01I)^-1 C_seen^T A_seen; logits=logits_CCGR + beta*cos(Norm(xW),A_c)
  switches: {ridge_source: class_centroids, ridge: 0.01, max_beta: 20.0, sdm_enabled: false}
  baseline_off_behavior: beta=0时严格回到CCGR；ridge_source=all_images时回到ARA统计
  parent_condition: TG-VPR + TST + NTR + CCGR
  training: 150个seen视觉中心闭式拟合W；7057张seen图像CE训练beta 20轮
