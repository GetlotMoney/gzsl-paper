ablation_attempts: [V2-TRY-092, V2-TRY-097]
module:
  module_id: ARA
  name: Attribute Residual Alignment
  purpose: 用显式属性证据补充GPT描述原型遗漏的细粒度部位线索
  inputs: [CLIP图像特征, CCGR类别原型, CUB标准312维类别属性]
  output: 200类主语义logit与属性残差logit之和
  formula: logits=logits_CCGR + beta * cosine(Norm(xW_ridge), attribute_c)
  switches: {ridge: 0.01, max_beta: 20.0, sdm_enabled: false}
  baseline_off_behavior: beta=0时严格回到CCGR父logits
  parent_condition: TG-VPR + TST + NTR + CCGR
  training: W_ridge由7057张seen图像闭式拟合；beta用seen CE训练20轮
evaluation_protocol: test_selected_inductive_gzsl
test_used_for_selection: true
unseen_images_used_for_gradient: false
primary_reporting: highest_seed_H_with_multiseed_range
framework_diagram: framework_diagram.html
decision: auxiliary_refinement_not_fourth_core_innovation
